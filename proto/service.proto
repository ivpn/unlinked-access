syntax = "proto3";

package proto;

option go_package = "/";

message TokenRequest {
    string input = 1;
    int32 ttl_minutes = 2;
    bool salt = 3;
}

message SignatureRequest {
    string input = 1;
    int32 ttl_minutes = 2;
}

message Response {
    string token = 1;
}

service Token {
    rpc GenerateToken(TokenRequest) returns (Response);
    rpc GenerateSignature(SignatureRequest) returns (Response);
}